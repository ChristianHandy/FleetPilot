name: Demo site

# Rebuilds the project website from the current code and publishes it on GitHub Pages:
# the homepage (demo/build_home.py) at the root, the live demo (demo/build_live.py:
# FleetPilot in the browser against an emulated homelab) under /demo/, and the
# static tour (demo/build_site.py) under /tour/.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"   # daily, so the homepage's GitHub numbers stay current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0     # the AI-share chart reads the whole history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install --require-hashes -r requirements-lock.txt -r requirements-dev-lock.txt
      - name: Test the emulated lab
        run: python -m pytest -q tests/test_demo_lab.py
      - name: Build the live demo
        run: python demo/build_live.py
      - name: Build the static tour
        run: python demo/build_site.py
      - name: Build the homepage
        env:
          FLEETPILOT_GITHUB_STATS: "1"     # open issues, good first issues, contributors, … from the GitHub API
          GH_TOKEN: ${{ github.token }}    # read-only; only raises the API rate limit
        run: python demo/build_home.py
      - name: AI-share chart and current-code badge (README and homepage)
        run: >-
          python scripts/ai_share.py --svg demo/site/ai-share.svg --json demo/site/ai-share.json
          --codebase-json demo/site/ai-codebase.json --badge demo/site/ai-code-badge.svg
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the site
      id-token: write   # prove to Pages which workflow deploys
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
