name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pip-audit bandit ruff
      - name: Lint for crashes (undefined or shadowed names)
        run: ruff check --select F821,F811,F823,F632,F601,F707,E9 --exclude FleetPilotCS,FleetPilotAndroid .
      - name: Run tests
        env:
          FLEETPILOT_DATA_DIR: ${{ runner.temp }}/fleetpilot-data
        run: |
          mkdir -p "$FLEETPILOT_DATA_DIR"
          python -m pytest -q
      - name: Check dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Bandit (high severity fails the build)
        run: bandit -q -r . -x ./FleetPilotCS,./FleetPilotAndroid,./hw_monitor/hw_stress_test.py,./test_*.py --severity-level high
