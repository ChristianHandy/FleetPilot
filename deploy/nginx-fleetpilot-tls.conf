# HTTPS front end for FleetPilot, following BSI TR-02102-2 and NIST SP 800-52r2:
# TLS 1.2/1.3 only, forward-secret AEAD cipher suites, HSTS, no version banner.
# Replace the certificate paths and server_name, then:
#   sudo ln -s /etc/nginx/sites-available/fleetpilot-tls /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# and set FLEETPILOT_PRODUCTION=true, FLEETPILOT_TRUST_PROXY=true and
# FLEETPILOT_COOKIE_SECURE=true in /opt/fleetpilot/.env.

server {
    listen 80;
    listen [::]:80;
    server_name fleetpilot.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fleetpilot.example.internal;

    ssl_certificate     /etc/ssl/fleetpilot/fullchain.pem;
    ssl_certificate_key /etc/ssl/fleetpilot/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve X25519:secp384r1:secp256r1;
    ssl_session_timeout 1h;
    ssl_session_cache shared:FleetPilotTLS:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
}
