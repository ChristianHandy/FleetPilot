# FleetPilot application reverse proxy. HAProxy owns the LAN ingress on
# port 80; install this private upstream as /etc/nginx/sites-available/fleetpilot.
server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 16m;
    server_tokens off;

    location = /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# For a company deployment, add a separate HTTPS server block with a trusted
# certificate, redirect HTTP to HTTPS, then set in /opt/fleetpilot/.env:
# FLEETPILOT_PRODUCTION=true
# FLEETPILOT_TRUST_PROXY=true
# FLEETPILOT_COOKIE_SECURE=true
# WTF_CSRF_ENABLED=true   # only after validating every legacy form
