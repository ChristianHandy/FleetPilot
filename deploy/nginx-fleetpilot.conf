# FleetPilot local reverse proxy. Install as /etc/nginx/sites-available/fleetpilot
# and enable it only after reviewing the server_name and HTTPS strategy.
server {
    listen 80;
    listen [::]:80;
    server_name fleetpilot.local _;

    client_max_body_size 16m;
    server_tokens off;

    location = /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# For a company deployment, add a separate HTTPS server block with a trusted
# certificate, redirect HTTP to HTTPS, then set in /opt/fleetpilot/.env:
# FLEETPILOT_PRODUCTION=true
# FLEETPILOT_TRUST_PROXY=true
# FLEETPILOT_COOKIE_SECURE=true
# WTF_CSRF_ENABLED=true   # only after validating every legacy form
