[pytest]
# Only test_*.py files are tests; hw_monitor/hw_stress_test.py is a remote script.
python_files = test_*.py
testpaths = .
norecursedirs = .git FleetPilotCS FleetPilotAndroid integrations hw_monitor data
# Every warning fails the run (OpenSSF warnings_strict). Silence a third-party warning
# here only with a comment saying why it cannot be fixed in FleetPilot.
filterwarnings =
    error
