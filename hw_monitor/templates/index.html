<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HW Monitor — Datacenter DGW15</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{
  --bg:#080c14;--bg2:#0d1220;--card:#111827;--card2:#1a2235;--glass:rgba(17,24,39,.8);
  --border:#1e2d45;--border2:#2a3f5f;--text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
  --green:#10b981;--green2:#065f46;--yellow:#f59e0b;--yellow2:#78350f;
  --red:#ef4444;--red2:#7f1d1d;--blue:#3b82f6;--blue2:#1e3a8a;
  --orange:#f97316;--purple:#a855f7;--cyan:#06b6d4;
  --glow-green:0 0 20px rgba(16,185,129,.3);--glow-red:0 0 20px rgba(239,68,68,.3);
  --glow-blue:0 0 20px rgba(59,130,246,.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(168,85,247,.05) 0%,transparent 60%);pointer-events:none;z-index:0;}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:50;background:rgba(8,12,20,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:56px;gap:6px;}
.nav-logo{font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:12px;white-space:nowrap;}
.nav-link{color:var(--muted2);text-decoration:none;font-size:.82rem;font-weight:500;padding:6px 12px;border-radius:8px;transition:all .15s;white-space:nowrap;}
.nav-link:hover{color:var(--text);background:var(--card2);}
.nav-link.active{color:#fff;background:var(--blue2);border:1px solid var(--blue);}
.nav-spacer{flex:1;}
.cluster-pill{font-size:.7rem;padding:4px 12px;border-radius:999px;background:linear-gradient(135deg,var(--blue2),var(--card2));border:1px solid var(--blue);color:var(--blue);font-weight:600;white-space:nowrap;}
.nav-btn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s;white-space:nowrap;}
.nav-btn:hover{opacity:.85;transform:translateY(-1px);}
.btn-start{background:linear-gradient(135deg,#059669,#10b981);color:#fff;}
.btn-stop{background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;}
.btn-ghost{background:var(--card2);color:var(--muted2);border:1px solid var(--border);}

/* ── MAIN ── */
main{position:relative;z-index:1;padding:20px 24px;max-width:1700px;margin:0 auto;}

/* ── SUMMARY BAR ── */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px;}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s;}
.sum-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.02),transparent);pointer-events:none;}
.sum-card:hover{border-color:var(--border2);}
.sum-card .val{font-size:1.75rem;font-weight:800;line-height:1;letter-spacing:-1px;}
.sum-card .lbl{font-size:.68rem;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.06em;font-weight:500;}
.sum-card .trend{font-size:.68rem;color:var(--muted);margin-top:2px;}

/* ── SERVER GRID ── */
.server-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}

/* ── SERVER CARD ── */
.srv-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all .2s;position:relative;}
.srv-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:0;transition:opacity .3s;}
.srv-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4);}
.srv-card:hover::before{opacity:1;}
.srv-card.online{border-color:rgba(16,185,129,.2);}
.srv-card.online::before{background:linear-gradient(90deg,transparent,var(--green),transparent);}
.srv-card.offline{border-color:rgba(239,68,68,.2);opacity:.85;}
.srv-card.offline::before{background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:1;}
.srv-card.warning{border-color:rgba(245,158,11,.25);}
.srv-card.warning::before{background:linear-gradient(90deg,transparent,var(--yellow),transparent);opacity:1;}
.srv-card.error{border-color:rgba(239,68,68,.4);box-shadow:var(--glow-red);}
.srv-card.error::before{background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:1;animation:pulse-bar 2s infinite;}
@keyframes pulse-bar{0%,100%{opacity:.5}50%{opacity:1}}

/* Card Header */
.card-head{padding:16px 18px 12px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border);}
.card-head-left h2{font-size:1rem;font-weight:700;letter-spacing:-.3px;}
.card-head-left .ip-row{display:flex;align-items:center;gap:8px;margin-top:3px;}
.card-head-left .ip{font-size:.72rem;color:var(--muted);font-family:monospace;}
.card-head-left .uptime{font-size:.68rem;color:var(--muted);background:var(--card2);padding:1px 6px;border-radius:4px;}
.status-badge{font-size:.68rem;padding:3px 10px;border-radius:999px;font-weight:700;letter-spacing:.03em;white-space:nowrap;}
.badge-online{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.badge-offline{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.badge-error{background:rgba(239,68,68,.2);color:var(--red);border:1px solid rgba(239,68,68,.5);animation:pulse-badge 2s infinite;}
.badge-warn{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3);}
.badge-running{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3);}
@keyframes pulse-badge{0%,100%{opacity:.8}50%{opacity:1}}

/* Card Body */
.card-body{padding:14px 18px;}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
.metric{display:flex;flex-direction:column;gap:3px;}
.metric .m-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500;}
.metric .m-val{font-size:.9rem;font-weight:700;line-height:1.2;}
.metric .m-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:3px;}
.metric .m-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.m-green{color:var(--green);}
.m-yellow{color:var(--yellow);}
.m-red{color:var(--red);}
.m-blue{color:var(--blue);}
.m-orange{color:var(--orange);}
.m-purple{color:var(--purple);}
.m-cyan{color:var(--cyan);}
.m-muted{color:var(--muted2);}

/* Divider */
.card-divider{height:1px;background:var(--border);margin:10px 0;}

/* Fans row */
.fans-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.fan-chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:.72rem;}
.fan-chip .fan-icon{font-size:.8rem;animation:spin 3s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fan-chip .fan-rpm{font-weight:700;color:var(--cyan);}

/* Offline last-data */
.offline-data{background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);border-radius:10px;padding:10px 12px;margin-top:10px;}
.offline-data .od-title{font-size:.68rem;color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.offline-data .od-row{display:flex;gap:16px;flex-wrap:wrap;}
.offline-data .od-item{font-size:.78rem;color:var(--muted2);}
.offline-data .od-item span{color:var(--text);font-weight:600;}
.offline-log{margin-top:8px;background:rgba(0,0,0,.3);border-radius:6px;padding:6px 8px;font-family:monospace;font-size:.67rem;color:var(--muted2);max-height:60px;overflow:hidden;line-height:1.5;}

/* Error banner */
.error-banner{background:linear-gradient(135deg,rgba(127,29,29,.4),rgba(239,68,68,.1));border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:10px 14px;margin-top:10px;display:flex;align-items:flex-start;gap:10px;}
.error-banner .err-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
.error-banner .err-text{flex:1;font-size:.78rem;color:#fca5a5;line-height:1.5;}
.error-banner .err-msg{font-weight:600;color:var(--red);font-size:.8rem;margin-bottom:2px;}
.ack-btn{padding:5px 12px;border-radius:7px;border:1px solid rgba(239,68,68,.5);background:rgba(239,68,68,.15);color:var(--red);cursor:pointer;font-size:.72rem;font-weight:600;transition:all .15s;flex-shrink:0;}
.ack-btn:hover{background:rgba(239,68,68,.3);transform:scale(1.03);}

/* Stress row */
.stress-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
.phase-tag{font-size:.7rem;padding:2px 10px;border-radius:6px;background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.2);font-weight:500;}
.running-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Card Actions */
.card-actions{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;background:rgba(0,0,0,.15);}
.act-btn{padding:5px 12px;border-radius:7px;border:none;cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s;}
.act-btn:hover{opacity:.85;transform:translateY(-1px);}
.ab-green{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.25);}
.ab-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.25);}
.ab-blue{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.25);}
.ab-orange{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.25);}
.ab-ghost{background:var(--card2);color:var(--muted2);border:1px solid var(--border);}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:28px;width:90%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.6);}
.modal h3{font-size:1.05rem;font-weight:700;margin-bottom:18px;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:.75rem;color:var(--muted2);margin-bottom:4px;font-weight:500;}
.fg input,.fg select{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--text);font-size:.88rem;transition:border-color .15s;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--blue);}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:12px 20px;font-size:.82rem;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateY(-4px);}
.toast.toast-ok{border-color:rgba(16,185,129,.4);color:var(--green);}
.toast.toast-err{border-color:rgba(239,68,68,.4);color:var(--red);}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
</style>
</head>
<body>
<nav>
  <span class="nav-logo">⚡ HW Monitor</span>
  <a href="/" class="nav-link active">Dashboard</a>
  <a href="/fans" class="nav-link">🌀 Fans</a>
  <a href="/setup" class="nav-link">⚙ Setup</a>
  <span class="nav-spacer"></span>
  <span class="cluster-pill" id="clusterStatus">● Cluster DGW15</span>
  <button class="nav-btn btn-start" onclick="startAll()">▶ Alle starten</button>
  <button class="nav-btn btn-stop" onclick="stopAll()">■ Alle stoppen</button>
  <button class="nav-btn btn-ghost" onclick="openAdd()">+ Server</button>
</nav>

<main>
  <!-- Summary Bar -->
  <div class="summary">
    <div class="sum-card"><div class="val" id="sTotal" style="color:var(--blue)">—</div><div class="lbl">Server</div></div>
    <div class="sum-card"><div class="val" id="sOnline" style="color:var(--green)">—</div><div class="lbl">Online</div></div>
    <div class="sum-card"><div class="val" id="sOffline" style="color:var(--red)">—</div><div class="lbl">Offline</div></div>
    <div class="sum-card"><div class="val" id="sRunning" style="color:var(--blue)">—</div><div class="lbl">Tests aktiv</div></div>
    <div class="sum-card"><div class="val" id="sErrors" style="color:var(--red)">—</div><div class="lbl">Fehler</div></div>
    <div class="sum-card"><div class="val" id="sWarn" style="color:var(--yellow)">—</div><div class="lbl">Warnungen</div></div>
    <div class="sum-card"><div class="val" id="sMaxCpu" style="color:var(--orange)">—</div><div class="lbl">Max CPU °C</div></div>
    <div class="sum-card"><div class="val" id="sMaxGpu" style="color:var(--purple)">—</div><div class="lbl">Max GPU °C</div></div>
    <div class="sum-card" style="min-width:160px"><div class="val" style="font-size:1rem;color:var(--muted2)" id="sTime">—</div><div class="lbl">Letztes Update</div></div>
  </div>

  <!-- Server Grid -->
  <div class="server-grid" id="grid">
    <div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:60px;font-size:.9rem">
      <div style="font-size:2rem;margin-bottom:12px">⚡</div>Verbinde mit Servern...
    </div>
  </div>
</main>

<!-- Add Server Modal -->
<div class="overlay" id="addModal">
  <div class="modal">
    <h3>Server hinzufügen</h3>
    <div class="fg"><label>Name</label><input id="fn" placeholder="pve05"></div>
    <div class="fg"><label>IP-Adresse</label><input id="fi" placeholder="192.168.1.x"></div>
    <div class="fg"><label>SSH-Port</label><input id="fp" value="22"></div>
    <div class="fg"><label>Benutzername</label><input id="fu" value="root"></div>
    <div class="fg"><label>Passwort</label><input id="fw" type="password"></div>
    <div class="modal-btns">
      <button class="act-btn ab-ghost" onclick="closeAdd()">Abbrechen</button>
      <button class="act-btn ab-blue" onclick="addServer()">Hinzufügen</button>
    </div>
  </div>
</div>

<!-- Acknowledge Modal -->
<div class="overlay" id="ackModal">
  <div class="modal">
    <h3>⚠ Fehler bestätigen</h3>
    <p style="font-size:.85rem;color:var(--muted2);margin-bottom:16px" id="ackMsg"></p>
    <div class="fg"><label>Notiz (optional)</label><input id="ackNote" placeholder="z.B. Untersucht, Kühler gereinigt..."></div>
    <div class="modal-btns">
      <button class="act-btn ab-ghost" onclick="closeAck()">Abbrechen</button>
      <button class="act-btn ab-red" onclick="confirmAck()">✓ Fehler bestätigen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let servers = [];
let ackSid = null;

// ── Helpers ──
const tc = t => {
  if(t == null) return 'm-muted';
  if(t >= 90) return 'm-red';
  if(t >= 80) return 'm-yellow';
  if(t >= 70) return 'm-orange';
  return 'm-green';
};
const barColor = (pct) => {
  if(pct >= 90) return '#ef4444';
  if(pct >= 70) return '#f59e0b';
  return '#3b82f6';
};
const fmt = (v, u='') => v != null ? `${v}${u}` : '—';
const fmtKB = kb => {
  if(kb == null) return '—';
  if(kb > 1024*1024) return `${(kb/1024/1024).toFixed(1)} GB/s`;
  if(kb > 1024) return `${(kb/1024).toFixed(1)} MB/s`;
  return `${kb.toFixed(0)} KB/s`;
};
const fmtUp = s => {
  if(!s) return '—';
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60);
  return d>0?`${d}d ${h}h`:h>0?`${h}h ${m}m`:`${m}m`;
};
const fmtTime = ts => {
  if(!ts) return '—';
  try { return new Date(ts).toLocaleString('de-DE',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch { return ts.slice(0,16); }
};

function statusBadge(s) {
  if(!s.reachable) return '<span class="status-badge badge-offline">● OFFLINE</span>';
  if(s.stress_failure) return '<span class="status-badge badge-error">⚠ FEHLER</span>';
  if(s.cpu_temp >= 85 || s.gpu_temp >= 85) return '<span class="status-badge badge-warn">▲ WARNUNG</span>';
  if(s.stress_running) return '<span class="status-badge badge-running">▶ TEST LÄUFT</span>';
  return '<span class="status-badge badge-online">● ONLINE</span>';
}

function cardClass(s) {
  if(!s.reachable) return 'srv-card offline';
  if(s.stress_failure) return 'srv-card error';
  if(s.cpu_temp >= 85 || s.gpu_temp >= 85) return 'srv-card warning';
  return 'srv-card online';
}

function renderCard(s) {
  const cpuPct = s.cpu_pct ?? 0;
  const ramPct = s.ram_total_mb ? Math.round(s.ram_used_mb/s.ram_total_mb*100) : 0;
  const fans = s.fans || [];
  const fansHtml = fans.filter(f=>f.rpm>0).map(f=>
    `<span class="fan-chip"><span class="fan-icon">⟳</span><span class="fan-rpm">${f.rpm}</span><span style="color:var(--muted);font-size:.65rem">RPM</span></span>`
  ).join('');

  // Offline: letzte bekannte Daten
  let offlineHtml = '';
  if(!s.reachable) {
    const lastCpu = s.last_cpu_temp;
    const lastGpu = s.last_gpu_temp;
    const lastSeen = s.last_seen_ts;
    const lastLog = s.last_log;
    if(lastCpu || lastSeen) {
      const logLines = lastLog ? lastLog.split('\n').filter(l=>l.trim()).slice(-3).join('\n') : '';
      offlineHtml = `
        <div class="offline-data">
          <div class="od-title">🕐 Letzte bekannte Daten</div>
          <div class="od-row">
            ${lastSeen ? `<div class="od-item">Zuletzt online: <span>${fmtTime(lastSeen)}</span></div>` : ''}
            ${lastCpu != null ? `<div class="od-item">CPU: <span class="${tc(lastCpu)}">${lastCpu}°C</span></div>` : ''}
            ${lastGpu != null ? `<div class="od-item">GPU: <span class="${tc(lastGpu)}">${lastGpu}°C</span></div>` : ''}
          </div>
          ${logLines ? `<div class="offline-log">${logLines.replace(/</g,'&lt;')}</div>` : ''}
        </div>`;
    }
  }

  // Fehler-Banner mit Acknowledge
  let errorHtml = '';
  if(s.stress_failure) {
    errorHtml = `
      <div class="error-banner">
        <span class="err-icon">⚠</span>
        <div class="err-text">
          <div class="err-msg">Hardware-Fehler erkannt</div>
          ${s.stress_failure.replace(/</g,'&lt;')}
        </div>
        <button class="ack-btn" onclick="openAck(${s.id},'${s.name}',event)">✓ Bestätigen</button>
      </div>`;
  }

  // Stress-Phase
  let stressHtml = '';
  if(s.stress_running || s.stress_phase) {
    stressHtml = `<div class="stress-row">
      ${s.stress_running ? '<span class="running-dot"></span><span style="font-size:.75rem;color:var(--green)">Läuft</span>' : ''}
      ${s.stress_phase ? `<span class="phase-tag">${s.stress_phase}</span>` : ''}
    </div>`;
  }

  return `<div class="${cardClass(s)}" id="card-${s.id}">
    <div class="card-head">
      <div class="card-head-left">
        <h2>${s.name}</h2>
        <div class="ip-row">
          <span class="ip">${s.ip}</span>
          ${s.uptime_s ? `<span class="uptime">↑ ${fmtUp(s.uptime_s)}</span>` : ''}
        </div>
      </div>
      ${statusBadge(s)}
    </div>
    <div class="card-body">
      ${s.reachable ? `
      <div class="metrics-grid">
        <div class="metric">
          <span class="m-label">CPU Temp</span>
          <span class="m-val ${tc(s.cpu_temp)}">${fmt(s.cpu_temp,'°C')}</span>
          <div class="m-bar"><div class="m-fill" style="width:${s.cpu_temp?Math.min(100,s.cpu_temp/100*100):0}%;background:${s.cpu_temp>=90?'var(--red)':s.cpu_temp>=80?'var(--yellow)':'var(--green)'}"></div></div>
        </div>
        <div class="metric">
          <span class="m-label">CPU Last</span>
          <span class="m-val m-blue">${fmt(s.cpu_pct,'%')}</span>
          <div class="m-bar"><div class="m-fill" style="width:${cpuPct}%;background:${barColor(cpuPct)}"></div></div>
        </div>
        <div class="metric">
          <span class="m-label">RAM</span>
          <span class="m-val m-muted">${s.ram_used_mb?`${(s.ram_used_mb/1024).toFixed(1)}/${(s.ram_total_mb/1024).toFixed(1)} GB`:'—'}</span>
          <div class="m-bar"><div class="m-fill" style="width:${ramPct}%;background:${barColor(ramPct)}"></div></div>
        </div>
        <div class="metric">
          <span class="m-label">GPU Temp</span>
          <span class="m-val ${tc(s.gpu_temp)}">${fmt(s.gpu_temp,'°C')}${s.gpu_on_bus===0?' <span style="color:var(--red)">⚠</span>':''}</span>
        </div>
        <div class="metric">
          <span class="m-label">Netz ↓</span>
          <span class="m-val m-cyan">${fmtKB(s.net_rx_kbps)}</span>
        </div>
        <div class="metric">
          <span class="m-label">Netz ↑</span>
          <span class="m-val m-purple">${fmtKB(s.net_tx_kbps)}</span>
        </div>
        <div class="metric">
          <span class="m-label">Disk R</span>
          <span class="m-val m-orange">${fmtKB(s.disk_read_kbps)}</span>
        </div>
        <div class="metric">
          <span class="m-label">Disk W</span>
          <span class="m-val m-yellow">${fmtKB(s.disk_write_kbps)}</span>
        </div>
      </div>
      ${fansHtml ? `<div class="card-divider"></div><div class="fans-row">${fansHtml}</div>` : ''}
      ${stressHtml}
      ` : offlineHtml}
      ${errorHtml}
    </div>
    <div class="card-actions">
      <button class="act-btn ab-green" onclick="act(${s.id},'start')">▶ Start</button>
      <button class="act-btn ab-red" onclick="act(${s.id},'stop')">■ Stop</button>
      <button class="act-btn ab-blue" onclick="location='/server/${s.id}'">📊 Details</button>
      <button class="act-btn ab-orange" onclick="location='/fans?sid=${s.id}'">🌀 Fans</button>
      <button class="act-btn ab-ghost" onclick="location='/setup?sid=${s.id}'">⚙ Setup</button>
    </div>
  </div>`;
}

// ── Refresh ──
async function refresh() {
  try {
    const res = await fetch('/api/live');
    servers = await res.json();
    const grid = document.getElementById('grid');
    grid.innerHTML = servers.length
      ? servers.map(renderCard).join('')
      : '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:60px">Keine Server konfiguriert</div>';

    // Summary
    const online = servers.filter(s=>s.reachable).length;
    const offline = servers.filter(s=>!s.reachable).length;
    document.getElementById('sTotal').textContent = servers.length;
    document.getElementById('sOnline').textContent = online;
    document.getElementById('sOffline').textContent = offline;
    document.getElementById('sRunning').textContent = servers.filter(s=>s.stress_running).length;
    document.getElementById('sErrors').textContent = servers.filter(s=>s.stress_failure).length;
    document.getElementById('sWarn').textContent = servers.filter(s=>s.cpu_temp>=85||s.gpu_temp>=85).length;
    const cpuTs = servers.filter(s=>s.cpu_temp).map(s=>s.cpu_temp);
    const gpuTs = servers.filter(s=>s.gpu_temp).map(s=>s.gpu_temp);
    document.getElementById('sMaxCpu').textContent = cpuTs.length ? Math.max(...cpuTs)+'°C' : '—';
    document.getElementById('sMaxGpu').textContent = gpuTs.length ? Math.max(...gpuTs)+'°C' : '—';
    document.getElementById('sTime').textContent = new Date().toLocaleTimeString('de-DE');

    // Cluster pill
    const pill = document.getElementById('clusterStatus');
    if(offline > 0) { pill.style.color='var(--red)'; pill.textContent=`⚠ ${offline} Offline`; }
    else { pill.style.color='var(--green)'; pill.textContent=`● Alle ${online} Online`; }
  } catch(e) { console.error(e); }
}

// ── Actions ──
async function act(sid, action) {
  toast(`${action}...`, 'info');
  const r = await fetch(`/api/server/${sid}/action`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action})
  });
  const d = await r.json();
  toast(d.ok ? `✓ ${action} OK` : `✗ ${d.output}`, d.ok ? 'ok' : 'err');
  setTimeout(refresh, 2500);
}

async function startAll() { for(const s of servers) await act(s.id,'start'); }
async function stopAll()  { for(const s of servers) await act(s.id,'stop'); }

// ── Acknowledge ──
function openAck(sid, name, e) {
  e.stopPropagation();
  ackSid = sid;
  document.getElementById('ackMsg').textContent = `Fehler auf Server "${name}" bestätigen und archivieren.`;
  document.getElementById('ackNote').value = '';
  document.getElementById('ackModal').classList.add('open');
}
function closeAck() { document.getElementById('ackModal').classList.remove('open'); }
async function confirmAck() {
  const note = document.getElementById('ackNote').value;
  const r = await fetch(`/api/server/${ackSid}/acknowledge`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({note})
  });
  const d = await r.json();
  closeAck();
  toast(d.ok ? '✓ Fehler bestätigt und archiviert' : '✗ Fehler', d.ok ? 'ok' : 'err');
  setTimeout(refresh, 1000);
}

// ── Add Server ──
function openAdd()  { document.getElementById('addModal').classList.add('open'); }
function closeAdd() { document.getElementById('addModal').classList.remove('open'); }
async function addServer() {
  const d = {
    name: document.getElementById('fn').value,
    ip: document.getElementById('fi').value,
    port: parseInt(document.getElementById('fp').value)||22,
    user: document.getElementById('fu').value,
    password: document.getElementById('fw').value
  };
  if(!d.name||!d.ip) { toast('Name und IP erforderlich','err'); return; }
  await fetch('/api/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  closeAdd(); toast('✓ Server hinzugefügt','ok'); refresh();
}

// ── Toast ──
function toast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type==='ok'?'toast-ok':type==='err'?'toast-err':''}`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Close modals on backdrop click ──
document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', e => { if(e.target===el) el.classList.remove('open'); });
});

refresh();
setInterval(refresh, 8000);
</script>
</body>
