<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FleetPilot</title>
<style>
  body { font-family: Inter, system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 40px; text-align: center; max-width: 400px; }
  h1 { font-size: 2rem; margin: 0 0 8px; background: linear-gradient(135deg, #58a6ff, #a371f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { color: #8b949e; margin: 0 0 24px; }
  .badge { background: #1f6feb; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  .api-link { display: inline-block; margin-top: 16px; color: #58a6ff; text-decoration: none; font-size: 0.875rem; }
</style>
</head>
<body>
<div class="card">
  <h1>⚡ FleetPilot</h1>
  <p>C# ASP.NET Core Backend</p>
  <span class="badge">v2.0.0</span>
  <br>
  <a class="api-link" href="/api/health">→ API Health Check</a>
</div>
</body>
</html>
