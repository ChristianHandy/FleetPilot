{% extends "base.html" %}
{# Disk Tools pages share the main FleetPilot shell and add a section nav. #}
{% block title %}Disk Tools{% endblock %}
{% block subnav %}
{% set p = request.path %}
<nav class="subnav" aria-label="Disk Tools">
  <a href="{{ url_for('disks_index') }}" class="{{ 'active' if p == '/disks' }}">Disks</a>
  <a href="{{ url_for('disk_tasks') }}" class="{{ 'active' if p.startswith('/disks/task') }}">Tasks</a>
  <a href="{{ url_for('disk_history') }}" class="{{ 'active' if p.startswith('/disks/history') }}">History</a>
  <a href="{{ url_for('disk_dashboard') }}" class="{{ 'active' if p.startswith('/disks/dashboard') }}">SMART summary</a>
  <a href="{{ url_for('remotes') }}" class="{{ 'active' if p.startswith('/disks/remote') }}">Remote hosts</a>
  <a href="{{ url_for('import_smart') }}" class="{{ 'active' if p.startswith('/disks/import') }}">Import</a>
</nav>
{% endblock %}
