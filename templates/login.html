<!doctype html>
<html lang="{{ current_lang|default('en') }}" data-theme="{{ current_theme|default('dark') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('Login') }} — FleetPilot</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version('style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('fp_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
  <script>
    // Accessibility settings saved by this browser on a previous visit
    try { var p = JSON.parse(localStorage.getItem('fp_a11y') || '{}'), h = document.documentElement;
      ['text','contrast','motion','links','spacing','font'].forEach(function (k) { if (p[k]) h.setAttribute('data-' + k, p[k]); });
    } catch (e) {}
  </script>
</head>
<body>

  <!-- Theme toggle (top-right corner) -->
  <div class="login-theme-btn">
    <button class="theme-toggle" id="theme-toggle" title="{{ _('Toggle theme') }}" type="button">
      <span class="theme-icon-light">{{ icon('sun') }}</span>
      <span class="theme-icon-dark">{{ icon('moon') }}</span>
    </button>
  </div>

  <main class="login-wrapper" id="main">
    <div class="login-card">

      <div class="login-logo">
        <div class="login-logo-icon">{{ icon('plane', 16) }}</div>
        <span class="sidebar-brand-title">FleetPilot</span>
      </div>

      <h1 class="login-title">{{ _('Sign In') }}</h1>
      <p class="login-subtitle">{{ _('Remote Fleet Management') }}</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-danger" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login', next=next) if next and next != '/index' else '/' }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label" for="username">{{ _('Username') }}</label>
          <input
            class="form-control"
            type="text"
            id="username"
            name="user"
            placeholder="{{ _('Enter your username') }}"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">{{ _('Password') }}</label>
          <input
            class="form-control"
            type="password"
            id="password"
            name="pass"
            placeholder="{{ _('Enter your password') }}"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:0.25rem;">
          {{ _('Sign In') }}
        </button>
      </form>

      <div class="divider"></div>
      <p style="font-size:0.84rem;margin:0;"><a href="/status">View service status</a></p>
    </div>
  </main>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', function() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        html.setAttribute('data-bs-theme', next);
        localStorage.setItem('fp_theme', next);
        fetch('/set_theme?theme=' + next, {method:'POST'}).catch(()=>{});
      });
    }
  });
</script>
</body>
</html>
