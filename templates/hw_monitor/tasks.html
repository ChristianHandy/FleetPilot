{% extends 'base.html' %}
{% block title %}HW Monitor Tasks{% endblock %}

{% block head %}
<style>
.task-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color var(--transition);}
.task-card:hover{border-color:rgba(59,130,246,.3);}
.task-card.running{border-left:3px solid var(--accent-blue);}
.task-card.success{border-left:3px solid var(--accent-green);}
.task-card.failed{border-left:3px solid var(--accent-red);}
.task-card.cancelled{border-left:3px solid var(--text-muted);}
.task-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;}
.task-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.task-icon.running{background:rgba(59,130,246,.15);}
.task-icon.success{background:rgba(16,185,129,.15);}
.task-icon.failed{background:rgba(239,68,68,.15);}
.task-icon.cancelled{background:rgba(100,116,139,.15);}
.task-info{flex:1;min-width:0;}
.task-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);}
.task-meta{font-size:.72rem;color:var(--text-secondary);margin-top:2px;}
.task-log{display:none;border-top:1px solid var(--border);}
.task-log.open{display:block;}
.log-content{background:#0a0f1a;padding:14px 18px;font-family:'Courier New',monospace;font-size:.72rem;line-height:1.6;max-height:300px;overflow-y:auto;color:#a0aec0;}
.log-line{white-space:pre-wrap;word-break:break-all;}
.log-line.err{color:var(--accent-red);}.log-line.ok{color:var(--accent-green);}.log-line.warn{color:var(--accent-amber);}
.fp-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(59,130,246,.3);border-top-color:var(--accent-blue);border-radius:50%;animation:fp-spin-sm .7s linear infinite;}
@keyframes fp-spin-sm{to{transform:rotate(360deg)}}
.progress-bar-anim{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px;}
.progress-fill-anim{height:100%;background:linear-gradient(90deg,var(--accent-blue),var(--accent-purple));border-radius:2px;animation:fp-progress 1.5s ease-in-out infinite;}
@keyframes fp-progress{0%{width:20%;margin-left:0}50%{width:40%;margin-left:30%}100%{width:20%;margin-left:80%}}
.filter-btn{padding:5px 14px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:.78rem;font-weight:500;background:var(--bg-surface);color:var(--text-secondary);transition:all var(--transition);}
.filter-btn.active{background:rgba(59,130,246,.1);border-color:var(--accent-blue);color:var(--accent-blue);}
</style>
{% endblock %}

{% block content %}
<div class="module-toolbar">
  <a href="/hw" class="btn btn-secondary btn-sm">&#x2190; Dashboard</a>
  <h1>&#x1F4CB; Task Manager</h1>
  <button class="btn btn-secondary btn-sm" onclick="loadTasks()">&#x21BB; Aktualisieren</button>
  <button class="btn btn-danger btn-sm" onclick="clearFinished()">&#x1F5D1; Abgeschlossene löschen</button>
</div>

<!-- Stats -->
<div class="summary-bar" style="grid-template-columns:repeat(4,1fr);max-width:600px;margin-bottom:1.5rem;">
  <div class="sum-card"><div class="val" id="statTotal">—</div><div class="lbl">Gesamt</div></div>
  <div class="sum-card"><div class="val" id="statRunning" style="color:var(--accent-blue)">—</div><div class="lbl">Laufend</div></div>
  <div class="sum-card"><div class="val" id="statSuccess" style="color:var(--accent-green)">—</div><div class="lbl">Erfolgreich</div></div>
  <div class="sum-card"><div class="val" id="statFailed" style="color:var(--accent-red)">—</div><div class="lbl">Fehler</div></div>
</div>

<!-- Filter -->
<div class="d-flex gap-2 mb-3 flex-wrap">
  <button class="filter-btn active" onclick="setFilter('all',this)">Alle</button>
  <button class="filter-btn" onclick="setFilter('running',this)">&#x1F535; Laufend</button>
  <button class="filter-btn" onclick="setFilter('success',this)">&#x1F7E2; Erfolgreich</button>
  <button class="filter-btn" onclick="setFilter('failed',this)">&#x1F534; Fehlgeschlagen</button>
  <button class="filter-btn" onclick="setFilter('cancelled',this)">&#x26AB; Abgebrochen</button>
</div>

<!-- Task List -->
<div class="d-flex flex-column gap-2" id="taskList">
  <div class="text-center text-muted p-5">
    <div style="font-size:3rem;margin-bottom:12px">&#x1F4ED;</div>
    <p>Keine Tasks vorhanden</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allTasks = [], activeFilter = 'all', openLogs = new Set(), logIntervals = {};
const icons = {running:'<span class="fp-spinner"></span>',success:'&#x2713;',failed:'&#x2717;',cancelled:'—'};
const statusLabels = {running:'Laufend',success:'Erfolgreich',failed:'Fehlgeschlagen',cancelled:'Abgebrochen'};
const statusColors = {running:'badge-running',success:'badge-green',failed:'badge-red',cancelled:'badge-gray'};

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

async function loadTasks() {
  const r = await fetch('/api/hw/tasks');
  allTasks = await r.json();
  updateStats();
  renderTasks();
}

function updateStats() {
  document.getElementById('statTotal').textContent = allTasks.length;
  document.getElementById('statRunning').textContent = allTasks.filter(t=>t.status==='running').length;
  document.getElementById('statSuccess').textContent = allTasks.filter(t=>t.status==='success').length;
  document.getElementById('statFailed').textContent = allTasks.filter(t=>t.status==='failed').length;
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const filtered = activeFilter==='all' ? allTasks : allTasks.filter(t=>t.status===activeFilter);
  if(!filtered.length) {
    list.innerHTML = '<div class="text-center text-muted p-5"><div style="font-size:3rem;margin-bottom:12px">&#x1F4ED;</div><p>Keine Tasks in dieser Kategorie</p></div>';
    return;
  }
  list.innerHTML = filtered.map(t => {
    const dur = t.finished_ts ? Math.round((new Date(t.finished_ts)-new Date(t.started_ts))/1000)+'s' : 'läuft...';
    const started = new Date(t.started_ts).toLocaleString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'});
    const logOpen = openLogs.has(t.id);
    return `<div class="task-card ${t.status}" id="tc-${t.id}">
      <div class="task-head" onclick="toggleLog('${t.id}')">
        <div class="task-icon ${t.status}">${icons[t.status]||'?'}</div>
        <div class="task-info">
          <div class="task-title">${t.title||t.type}</div>
          <div class="task-meta">Server: <b>${t.server_name||'—'}</b> · ${started} · Dauer: ${dur}</div>
          ${t.status==='running'?'<div class="progress-bar-anim"><div class="progress-fill-anim"></div></div>':''}
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="status-badge ${statusColors[t.status]||'badge-gray'}">${statusLabels[t.status]||t.status}</span>
        </div>
        <div class="d-flex gap-1" onclick="event.stopPropagation()">
          ${t.status==='running'?`<button class="btn btn-danger btn-sm" onclick="cancelTask('${t.id}')">&#x25A0; Stop</button>`:''}
          <button class="btn btn-secondary btn-sm" onclick="toggleLog('${t.id}')">&#x1F4C4; Log</button>
          ${t.status!=='running'?`<button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">&#x2715;</button>`:''}
        </div>
      </div>
      <div class="task-log ${logOpen?'open':''}" id="log-${t.id}">
        <div class="log-content" id="logc-${t.id}">Lade Log...</div>
      </div>
    </div>`;
  }).join('');
  openLogs.forEach(id => loadLog(id));
}

function toggleLog(id) {
  const el = document.getElementById(`log-${id}`);
  if(!el) return;
  if(el.classList.contains('open')) {
    el.classList.remove('open'); openLogs.delete(id);
    if(logIntervals[id]){clearInterval(logIntervals[id]);delete logIntervals[id];}
  } else {
    el.classList.add('open'); openLogs.add(id); loadLog(id);
    const task = allTasks.find(t=>t.id===id);
    if(task && task.status==='running') logIntervals[id] = setInterval(()=>loadLog(id), 2000);
  }
}

async function loadLog(id) {
  const r = await fetch(`/api/hw/tasks/${id}/log`);
  const d = await r.json();
  const el = document.getElementById(`logc-${id}`);
  if(!el) return;
  if(d.lines && d.lines.length) {
    el.innerHTML = d.lines.map(l => {
      let cls='';
      if(/error|fail|critical/i.test(l)) cls='err';
      else if(/ok|success|done|complete/i.test(l)) cls='ok';
      else if(/warn|warning/i.test(l)) cls='warn';
      return `<div class="log-line ${cls}">${l.replace(/</g,'&lt;')}</div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  } else el.innerHTML = '<div class="log-line" style="color:#64748b">Kein Log verfügbar</div>';
  if(d.status!=='running' && logIntervals[id]){clearInterval(logIntervals[id]);delete logIntervals[id];}
}

async function cancelTask(id) {
  await fetch(`/api/hw/tasks/${id}/cancel`, {method:'POST'});
  loadTasks();
}
async function deleteTask(id) {
  await fetch(`/api/hw/tasks/${id}/delete`, {method:'POST'});
  openLogs.delete(id); loadTasks();
}
async function clearFinished() {
  await fetch('/api/hw/tasks/clear', {method:'POST'});
  loadTasks();
}

loadTasks();
setInterval(loadTasks, 5000);
</script>
{% endblock %}
