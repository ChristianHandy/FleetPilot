<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Manager — HW Monitor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{--bg:#080c14;--bg2:#0d1220;--card:#111827;--card2:#1a2235;--border:#1e2d45;--border2:#2a3f5f;--text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;--blue:#3b82f6;--orange:#f97316;--purple:#a855f7;--cyan:#06b6d4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,.06) 0%,transparent 60%);pointer-events:none;}
nav{position:sticky;top:0;z-index:50;background:rgba(8,12,20,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:56px;gap:6px;}
.nav-logo{font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:12px;}
.nav-link{color:var(--muted2);text-decoration:none;font-size:.82rem;font-weight:500;padding:6px 12px;border-radius:8px;transition:all .15s;}
.nav-link:hover{color:var(--text);background:var(--card2);}
.nav-link.active{color:#fff;background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.3);}
main{position:relative;z-index:1;padding:24px;max-width:1400px;margin:0 auto;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
h1{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-actions{display:flex;gap:8px;}
.btn{padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .15s;}
.btn:hover{opacity:.85;transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.btn-ghost{background:var(--card2);color:var(--muted2);border:1px solid var(--border);}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;}
.stat-val{font-size:1.6rem;font-weight:800;line-height:1;}
.stat-label{font-size:.72rem;color:var(--muted2);margin-top:4px;}
.task-list{display:flex;flex-direction:column;gap:10px;}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s;}
.task-card:hover{border-color:var(--border2);}
.task-card.running{border-left:3px solid var(--blue);}
.task-card.success{border-left:3px solid var(--green);}
.task-card.failed{border-left:3px solid var(--red);}
.task-card.cancelled{border-left:3px solid var(--muted);}
.task-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;}
.task-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.task-icon.running{background:rgba(59,130,246,.15);}
.task-icon.success{background:rgba(16,185,129,.15);}
.task-icon.failed{background:rgba(239,68,68,.15);}
.task-icon.cancelled{background:rgba(100,116,139,.15);}
.task-info{flex:1;min-width:0;}
.task-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.task-meta{font-size:.72rem;color:var(--muted2);margin-top:2px;}
.task-status{display:flex;align-items:center;gap:6px;}
.badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;}
.badge-running{background:rgba(59,130,246,.15);color:var(--blue);}
.badge-success{background:rgba(16,185,129,.15);color:var(--green);}
.badge-failed{background:rgba(239,68,68,.15);color:var(--red);}
.badge-cancelled{background:rgba(100,116,139,.15);color:var(--muted2);}
.task-actions{display:flex;gap:6px;}
.task-btn{padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:.72rem;font-weight:600;background:var(--card2);color:var(--muted2);transition:all .15s;}
.task-btn:hover{color:var(--text);}
.task-btn.danger{color:var(--red);}
.task-log{display:none;border-top:1px solid var(--border);padding:0;}
.task-log.open{display:block;}
.log-content{background:#0a0f1a;padding:14px 18px;font-family:'Courier New',monospace;font-size:.72rem;line-height:1.6;max-height:300px;overflow-y:auto;color:#a0aec0;}
.log-line{white-space:pre-wrap;word-break:break-all;}
.log-line.err{color:var(--red);}
.log-line.ok{color:var(--green);}
.log-line.warn{color:var(--yellow);}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(59,130,246,.3);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted2);}
.empty-icon{font-size:3rem;margin-bottom:12px;}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-btn{padding:5px 14px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:.78rem;font-weight:500;background:var(--card);color:var(--muted2);transition:all .15s;}
.filter-btn.active{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue);}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:2px;animation:progress 1.5s ease-in-out infinite;}
@keyframes progress{0%{width:20%;margin-left:0}50%{width:40%;margin-left:30%}100%{width:20%;margin-left:80%}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:12px 20px;font-size:.82rem;z-index:200;opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<nav>
  <span class="nav-logo">⚡ HW Monitor</span>
  <a href="/hw" class="nav-link">Dashboard</a>
  <a href="/hw/fans" class="nav-link">🌀 Fans</a>
  <a href="/hw/setup" class="nav-link">⚙ Setup</a>
  <a href="/hw/tasks" class="nav-link active">📋 Tasks</a>
</nav>
<main>
  <div class="page-header">
    <div>
      <h1>📋 Task Manager</h1>
      <p style="font-size:.82rem;color:var(--muted2);margin-top:4px">Alle laufenden und abgeschlossenen Operationen</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="loadTasks()">↻ Aktualisieren</button>
      <button class="btn btn-danger" onclick="clearFinished()">🗑 Abgeschlossene löschen</button>
    </div>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-val" id="statTotal">—</div><div class="stat-label">Gesamt</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--blue)" id="statRunning">—</div><div class="stat-label">Laufend</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--green)" id="statSuccess">—</div><div class="stat-label">Erfolgreich</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--red)" id="statFailed">—</div><div class="stat-label">Fehlgeschlagen</div></div>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">Alle</button>
    <button class="filter-btn" onclick="setFilter('running',this)">🔵 Laufend</button>
    <button class="filter-btn" onclick="setFilter('success',this)">🟢 Erfolgreich</button>
    <button class="filter-btn" onclick="setFilter('failed',this)">🔴 Fehlgeschlagen</button>
    <button class="filter-btn" onclick="setFilter('cancelled',this)">⚫ Abgebrochen</button>
  </div>

  <div class="task-list" id="taskList">
    <div class="empty-state"><div class="empty-icon">📭</div><p>Keine Tasks vorhanden</p></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
let allTasks = [], activeFilter = 'all', openLogs = new Set(), logIntervals = {};

const icons = {running:'⟳',success:'✓',failed:'✗',cancelled:'—'};
const statusLabels = {running:'Laufend',success:'Erfolgreich',failed:'Fehlgeschlagen',cancelled:'Abgebrochen'};

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

async function loadTasks() {
  const r = await fetch('/api/hw/tasks');
  allTasks = await r.json();
  updateStats();
  renderTasks();
}

function updateStats() {
  document.getElementById('statTotal').textContent = allTasks.length;
  document.getElementById('statRunning').textContent = allTasks.filter(t=>t.status==='running').length;
  document.getElementById('statSuccess').textContent = allTasks.filter(t=>t.status==='success').length;
  document.getElementById('statFailed').textContent = allTasks.filter(t=>t.status==='failed').length;
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const filtered = activeFilter === 'all' ? allTasks : allTasks.filter(t=>t.status===activeFilter);
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>Keine Tasks in dieser Kategorie</p></div>';
    return;
  }
  list.innerHTML = filtered.map(t => {
    const dur = t.finished_ts
      ? Math.round((new Date(t.finished_ts)-new Date(t.started_ts))/1000)+'s'
      : 'läuft...';
    const started = new Date(t.started_ts).toLocaleString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'});
    const logOpen = openLogs.has(t.id);
    return `<div class="task-card ${t.status}" id="tc-${t.id}">
      <div class="task-head" onclick="toggleLog('${t.id}')">
        <div class="task-icon ${t.status}">${t.status==='running'?'<span class="spinner"></span>':icons[t.status]}</div>
        <div class="task-info">
          <div class="task-title">${t.title||t.type}</div>
          <div class="task-meta">Server: <b>${t.server_name||'—'}</b> · ${started} · Dauer: ${dur}</div>
          ${t.status==='running'?'<div class="progress-bar"><div class="progress-fill"></div></div>':''}
        </div>
        <div class="task-status">
          <span class="badge badge-${t.status}">${statusLabels[t.status]}</span>
        </div>
        <div class="task-actions" onclick="event.stopPropagation()">
          ${t.status==='running'?`<button class="task-btn danger" onclick="cancelTask('${t.id}')">■ Stop</button>`:''}
          <button class="task-btn" onclick="toggleLog('${t.id}')">📄 Log</button>
          ${t.status!=='running'?`<button class="task-btn danger" onclick="deleteTask('${t.id}')">✕</button>`:''}
        </div>
      </div>
      <div class="task-log ${logOpen?'open':''}" id="log-${t.id}">
        <div class="log-content" id="logc-${t.id}">Lade Log...</div>
      </div>
    </div>`;
  }).join('');
  // Restore open logs
  openLogs.forEach(id => loadLog(id));
}

function toggleLog(id) {
  const el = document.getElementById(`log-${id}`);
  if (!el) return;
  if (el.classList.contains('open')) {
    el.classList.remove('open');
    openLogs.delete(id);
    if (logIntervals[id]) { clearInterval(logIntervals[id]); delete logIntervals[id]; }
  } else {
    el.classList.add('open');
    openLogs.add(id);
    loadLog(id);
    // Auto-refresh for running tasks
    const task = allTasks.find(t=>t.id===id);
    if (task && task.status === 'running') {
      logIntervals[id] = setInterval(() => loadLog(id), 2000);
    }
  }
}

async function loadLog(id) {
  const r = await fetch(`/api/hw/tasks/${id}/log`);
  const d = await r.json();
  const el = document.getElementById(`logc-${id}`);
  if (!el) return;
  if (d.lines && d.lines.length) {
    el.innerHTML = d.lines.map(l => {
      let cls = '';
      if (/error|fail|critical/i.test(l)) cls = 'err';
      else if (/ok|success|done|complete/i.test(l)) cls = 'ok';
      else if (/warn|warning/i.test(l)) cls = 'warn';
      return `<div class="log-line ${cls}">${l.replace(/</g,'&lt;')}</div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  } else {
    el.innerHTML = '<div class="log-line" style="color:var(--muted)">Kein Log verfügbar</div>';
  }
  // Stop interval if task finished
  if (d.status !== 'running' && logIntervals[id]) {
    clearInterval(logIntervals[id]); delete logIntervals[id];
  }
}

async function cancelTask(id) {
  await fetch(`/api/hw/tasks/${id}/cancel`, {method:'POST'});
  toast('Task abgebrochen');
  loadTasks();
}

async function deleteTask(id) {
  await fetch(`/api/hw/tasks/${id}/delete`, {method:'POST'});
  openLogs.delete(id);
  loadTasks();
}

async function clearFinished() {
  await fetch('/api/hw/tasks/clear', {method:'POST'});
  toast('Abgeschlossene Tasks gelöscht');
  loadTasks();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 3000);
}

// Auto-refresh
loadTasks();
setInterval(loadTasks, 5000);
</script>
</body>
</html>
